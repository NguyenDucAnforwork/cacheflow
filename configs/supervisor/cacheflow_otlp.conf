[program:cacheflow_otlp]
environment=PROC_NAME="%(program_name)s"
command=/venv/main/bin/python /workspace/scripts/otlp_capture.py --output /workspace/results/raw/otlp-profile.jsonl
autostart=false
autorestart=unexpected
exitcodes=0
startsecs=1
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
