[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cacheflow"
version = "0.1.0"
description = "Single-GPU delay-hit-aware LLM serving study"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "httpx>=0.28", "PyYAML>=6", "transformers==5.6.2", "numpy>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.9", "psutil>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
